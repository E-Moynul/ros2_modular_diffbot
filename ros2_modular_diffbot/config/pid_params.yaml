# =========================================================================
# pid_params.yaml
#
# এই ফাইলে pid_controller.py এর মধ্যে যা hardcode করা ছিল (kp, ki, kd,
# wheel_base, wheel_radius ইত্যাদি) তা বের করে আনা হয়েছে।
#
# কেন বাইরে আনা হলো:
#   PID tune করার সময় একই সংখ্যা বারবার পরিবর্তন করতে হয়। কোডের ভেতর
#   হলে প্রতিবার .py ফাইল এডিট + rebuild লাগত। এখন শুধু এই yaml ফাইলে
#   সংখ্যা বদলে launch করলেই নতুন মান লোড হয়ে যাবে, rebuild লাগবে না।
#
# node name (pid_controller) টা exact match হতে হবে launch file এ যেই
# node/executable name ব্যবহার করছ তার সাথে।
# =========================================================================

pid_controller:
  ros__parameters:
    wheel_base: 0.17          # মিটার - robot_gazebo.xacro এর wheel_separation এর সাথে অবশ্যই মিলতে হবে
    wheel_radius: 0.03        # মিটার - robot_gazebo.xacro এর wheel_diameter/2 এর সাথে মিলতে হবে

    kp: 15.0                  # শুরুতে শুধু এটা দিয়ে টিউন করা সহজ
    ki: 5.0                   # steady-state error কমায়, বেশি দিলে oscillate করবে
    kd: 0.5                   # sudden change smooth করে, বেশি দিলে noisy হয়ে যায়

    max_pwm: 255              # motor driver এর সর্বোচ্চ PWM মান
    control_frequency: 10.0   # Hz - WiFi এর জন্য এর বেশি না রাখাই ভালো

# ভবিষ্যতে real hardware এর জন্য যখন launch file বানাবে (Tinkercad/hardware
# ধাপের পরে), তখন pid_controller node এ এভাবে এই yaml লোড করবে:
#
#   Node(
#       package='ros2_modular_diffbot',
#       executable='pid_controller',
#       parameters=[os.path.join(pkg_path, 'config', 'pid_params.yaml')]
#   )
